services:
  trainer:
    build:
      context: .
    command: ["drone-train"]
    environment:
      RETRAIN: ${RETRAIN:-false}
      RUN_NAME: ${RUN_NAME:-s8-cfd-dev}
      DEVICE: ${DEVICE:-auto}
      MODEL_NAME: ${MODEL_NAME:-s8_cfd}
      MODEL_PATH: ${MODEL_PATH:-}
      TRAIN_EPOCHS: ${TRAIN_EPOCHS:-50}
      BATCH_SIZE: ${BATCH_SIZE:-2}
      LEARNING_RATE: ${LEARNING_RATE:-0.001}
      WEIGHT_DECAY: ${WEIGHT_DECAY:-0.0001}
      NUM_WORKERS: ${NUM_WORKERS:-0}
      PIN_MEMORY: ${PIN_MEMORY:-auto}
      PERSISTENT_WORKERS: ${PERSISTENT_WORKERS:-auto}
      PREFETCH_FACTOR: ${PREFETCH_FACTOR:-2}
      TRAIN_LIMIT: ${TRAIN_LIMIT:-}
      VAL_LIMIT: ${VAL_LIMIT:-}
      RESUME: ${RESUME:-false}
      LR_SCHEDULER: ${LR_SCHEDULER:-none}
      EARLY_STOPPING_PATIENCE: ${EARLY_STOPPING_PATIENCE:-}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.30}
      EVAL_CONFIDENCE_FLOOR: ${EVAL_CONFIDENCE_FLOOR:-0.001}
      NMS_IOU_THRESHOLD: ${NMS_IOU_THRESHOLD:-0.50}
      EVAL_TOP_K: ${EVAL_TOP_K:-500}
      MAX_DETECTIONS: ${MAX_DETECTIONS:-100}
      PROGRESS: ${PROGRESS:-true}
      WANDB_ENABLED: ${WANDB_ENABLED:-false}
      WANDB_PROJECT: ${WANDB_PROJECT:-drone-detection-and-classification-engine}
      WANDB_RUN_NAME: ${WANDB_RUN_NAME:-}
      WANDB_TAGS: ${WANDB_TAGS:-}
      ALLOW_TEST_INFERENCE: "false"
      SEED: ${SEED:-42}
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models
      - ./reports:/app/reports

  inferencer:
    build:
      context: .
    command: ["drone-infer"]
    depends_on:
      trainer:
        condition: service_completed_successfully
    environment:
      DEVICE: ${DEVICE:-auto}
      RUN_NAME: ${RUN_NAME:-s8-cfd-dev}
      MODEL_NAME: ${MODEL_NAME:-s8_cfd}
      MODEL_PATH: ${MODEL_PATH:-}
      NUM_WORKERS: ${NUM_WORKERS:-0}
      PIN_MEMORY: ${PIN_MEMORY:-auto}
      PERSISTENT_WORKERS: ${PERSISTENT_WORKERS:-auto}
      PREFETCH_FACTOR: ${PREFETCH_FACTOR:-2}
      INFERENCE_SPLIT: ${INFERENCE_SPLIT:-val}
      INFERENCE_LIMIT: ${INFERENCE_LIMIT:-20}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.30}
      EVAL_CONFIDENCE_FLOOR: ${EVAL_CONFIDENCE_FLOOR:-0.001}
      NMS_IOU_THRESHOLD: ${NMS_IOU_THRESHOLD:-0.50}
      EVAL_TOP_K: ${EVAL_TOP_K:-500}
      MAX_DETECTIONS: ${MAX_DETECTIONS:-100}
      SAVE_PREDICTIONS: ${SAVE_PREDICTIONS:-true}
      THRESHOLD_ANALYSIS: ${THRESHOLD_ANALYSIS:-false}
      THRESHOLD_MIN: ${THRESHOLD_MIN:-0.0}
      THRESHOLD_MAX: ${THRESHOLD_MAX:-0.95}
      THRESHOLD_STEP: ${THRESHOLD_STEP:-0.05}
      PROGRESS: ${PROGRESS:-true}
      ALLOW_TEST_INFERENCE: ${ALLOW_TEST_INFERENCE:-false}
      SEED: ${SEED:-42}
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
      - ./reports:/app/reports
